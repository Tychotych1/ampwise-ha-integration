# Tests van de Ampwise-integratie op Linux, met de versie van Home Assistant die in productie draait.
# De tests met een nagebootste Home Assistant (tests/ha/) gebruiken pytest-homeassistant-custom-component. Die bibliotheek bestaat per Home Assistant-versie: 0.13.375 hoort bij
# Home Assistant 2026.10.4 en vraagt Python 3.14 (zie requirements_test_ci.txt). Lokaal op Python 3.12 gebruik je requirements_test.txt (nabootsing van Home Assistant 2025.1.4).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-assistant:
    name: Integratie in Home Assistant 2026.10.4 (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test_ci.txt
      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test_ci.txt
      - name: Versies tonen (bewijs welke Home Assistant is nagebootst)
        run: |
          python --version
          python -m pip show homeassistant pytest-homeassistant-custom-component | grep -E '^(Name|Version):'
      - name: Tests
        run: python -m pytest tests -q

  berichten:
    name: Berichten en bestanden (zonder Home Assistant, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests van de berichten en de bestanden rond de integratie
        run: python -m unittest discover -s tests -t . -v
